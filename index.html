row.next{right:14px}.slide-arrow:hover{background:white}.slide-dots{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:9px;background:#182b2380;border-radius:20px;padding:9px 12px}.slide-dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#ffffff88;cursor:pointer}.slide-dot.active{background:white;transform:scale(1.18)}@media(max-width:650px){.photo-carousel{aspect-ratio:4/3}.slide-arrow{width:38px;height:38px;font-size:27px}}@media(prefers-reduced-motion:reduce){.photo-carousel .slides{transition:none}}/* Consistent softly framed image galleries */

const data={ro:{hero:'Bine ați venit!',intro:'Tot ce aveți nevoie pentru o ședere liniștită la Sovata.',nav:['Sosire','Parcare','Facilități','Mic dejun · Ciuperca Mică','SPA','De explorat','Contact'],sections:[['Sosire și plecare',`<div class="grid"><div class="card"><div class="muted">CHECK-IN</div><div class="big">14:00–24:00</div><p>Accesul se face prin self check-in. Vila nu are recepție permanentă.</p></div><div class="card"><div class="muted">CHECK-OUT</div><div class="big">Până la 11:00</div><p>La plecare, lăsați cheia în ușa camerei, pe interior.</p></div></div><h3>Accesul în vilă</h3><p>Introduceți codul de acces primit separat pe interfon. Așteptați aproximativ două secunde, până la semnalul discret, apoi deschideți ușa. La ieșire, apăsați butonul negru deasupra clanței.</p><p>Cheia camerei se află în ușă, pe interior. Numele camerei și codul de acces vi se comunică în mesajul de sosire.</p>`],['Parcare',`<div class="card parking-map"><img src="parking.jpg" alt="Parking layout Salt & Soul" loading="lazy"><p class="muted">Hartă orientativă / Parking layout / Parkolási vázlat</p></div><p>Locurile de parcare se află în fața și în spatele vilei. Parcarea din spate este mai îngustă. Vă rugăm să parcați între liniile marcate, astfel încât să rămână loc pentru toate mașinile.</p><p>Dacă aveți un loc alocat, numărul acestuia vă va fi comunicat separat.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Salt%20and%20Soul%20Sovata">Deschideți harta</a>`],['Facilități și informații utile',`<div class="grid"><div class="card"><h3>WiFi</h3><p>Rețea: <strong>Salt&Soul</strong><br>Parolă: <strong>salt2025</strong></p><button class="btn light" onclick="copyWifi()">Copiază parola</button></div><div class="card"><h3>Spații comune</h3><div class="shared-gallery"><div class="card"><img src="kitchen.jpg" alt="Bucătăria comună" loading="lazy"><div class="muted">Bucătăria comună</div></div><div class="card"><img src="lounge.jpg" alt="Livingul comun" loading="lazy"><div class="muted">Livingul comun</div></div></div><p>La parter găsiți livingul comun, cafea și ciocolată caldă din partea casei. Puteți folosi și terasa din spatele vilei.</p></div></div><h3>Curățenie și liniște</h3><p>Pentru detalii privind curățenia sau schimbarea prosoapelor, contactați-ne pe WhatsApp. Vă rugăm să respectați liniștea celorlalți oaspeți.</p>`],['Mic dejun la Restaurantul Ciuperca Mică',`<div class="photo-carousel" data-carousel><div class="slides"><img src="ciuperca-01-exterior.jpg" alt="Ciuperca Mică – restaurant and breakfast photo 1" loading="lazy"><img src="ciuperca-02-terrace.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 2" loading="lazy"><img src="ciuperca-03-breakfast.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 3" loading="lazy"><img src="ciuperca-04-salmon.jpg" alt="Ciuperca Mică – restaurant and breakfast photo 4" loading="lazy"><img src="ciuperca-05-bruschetta.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 5" loading="lazy"></div><button class="slide-arrow prev" type="button" aria-label="Previous photo" onclick="moveSlide(this,-1)">‹</button><button class="slide-arrow next" type="button" aria-label="Next photo" onclick="moveSlide(this,1)">›</button><div class="slide-dots" aria-label="Photo selection"></div></div><span class="tag">În funcție de rezervare</span><p>Dacă rezervarea include micul dejun, acesta se servește la restaurantul partener <strong>Ciuperca Mică</strong>, lângă Lacul Ursu, la aproximativ 3–4 minute de mers pe jos. Micul dejun este à la carte.</p><p><strong>Program obișnuit: 9:00–12:00.</strong> Dacă doriți să veniți mai devreme, vă rugăm să ne anunțați. Codul QR necesar este trimis separat.</p><div class="warning">Restaurantul nu se află în clădirea vilei. Micul dejun este inclus doar dacă apare în rezervarea dumneavoastră.</div>`],['SPA și relaxare',`<span class="tag">Disponibil în funcție de pachet</span><div class="grid"><div class="card"><div class="photo-carousel" data-carousel><div class="slides"><img src="pool.jpg" alt="Hotel Pacsirta pool" loading="lazy"><img src="sauna.jpg" alt="Hotel Pacsirta sauna" loading="lazy"></div><button class="slide-arrow prev" type="button" aria-label="Previous photo" onclick="moveSlide(this,-1)">‹</button><button class="slide-arrow next" type="button" aria-label="Next photo" onclick="moveSlide(this,1)">›</button><div class="slide-dots" aria-label="Photo selection"></div></div><h3>Hotel Pacsirta SPA</h3><p>Un spa mai intim, la aproximativ 200 m de vilă. Dacă pachetul include accesul, voucherul fizic se găsește în cameră și se predă la recepția hotelului. Durata accesului depinde de rezervare.</p></div><div class="card"><div class="media-frame spa-image-frame"><img class="spa-still" src="praid.jpg" alt="Wellness Praid" loading="lazy"></div><h3>Wellness Praid</h3><p>O alternativă de wellness mai mare, atunci când schimbarea este disponibilă pentru rezervarea dumneavoastră. Voucherul poate fi transmis electronic.</p></div></div><p>SPA-ul nu se află în clădirea vilei. Contactați-ne pentru a verifica opțiunile disponibile.</p>`],['Descoperiți Sovata',`<div class="grid"><div class="card"><img class="photo" src="lake.jpg" alt="Lacul Ursu, Sovata" loading="lazy"><h3>Lacul Ursu</h3><p>O plimbare în jurul lacului este una dintre cele mai plăcute modalități de a descoperi Sovata.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Lacul+Ursu+Sovata">Hartă</a></div><div class="card"><img class="photo" src="train.jpg" alt="Mocănița Sovata" loading="lazy"><h3>Mocănița Sovata</h3><p>O experiență cu trenul turistic, potrivită pentru o ieșire în zonă. Verificați programul înainte de plecare.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Mocanita+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="drumul-sarii.jpg" alt="Drumul Sării" loading="lazy"><h3>Drumul Sării</h3><p>Un traseu tematic prin pădure, printre lacuri și formațiuni de sare. Circuitul eco-didactic al Sării are aproximativ 970 m.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Drumul+Sarii+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="lacuri-rosu-verde.jpg" alt="Lacurile Roșu și Verde" loading="lazy"><h3>Lacurile Roșu și Verde</h3><p>Două lacuri sărate pe care le puteți admira de pe aleile amenajate, în apropierea Muntelui de Sare.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Rosu+Lacul+Verde+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="muntele-sare.jpg" alt="Muntele de Sare" loading="lazy"><h3>Muntele de Sare</h3><p>Descoperiți formațiunile naturale de sare din apropierea Lacului Ursu. Rămâneți pe potecile amenajate.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Muntele+de+Sare+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="belvedere.jpg" alt="Turnul Belvedere" loading="lazy"><h3>Turnul Belvedere</h3><p>Un punct de belvedere cu panoramă asupra stațiunii și dealurilor din jur. Accesul presupune urcare.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Turnul+Belvedere+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="tivoli.jpg" alt="Lacul Tivoli" loading="lazy"><h3>Lacul Tivoli</h3><p>Un loc liniștit pentru o plimbare în natură. Activitățile disponibile pot varia în funcție de sezon.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Tivoli+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="alunis.jpg" alt="Lacul Aluniș" loading="lazy"><h3>Lacul Aluniș</h3><p>Un lac sărat în apropierea Lacului Ursu, potrivit pentru a fi descoperit la pas.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Alunis+Sovata">Hartă</a></div></div>`],['Suntem aici pentru voi',`<p>Dacă aveți întrebări în timpul șederii, ne puteți contacta telefonic sau pe WhatsApp.</p><a class="btn" href="https://wa.me/40749250933">Scrieți pe WhatsApp</a><a class="btn light" href="tel:+40749250933">Sunați: 0749 250 933</a><a class="btn light" href="mailto:saltandsoul.sovata@gmail.com">Email</a><p class="muted">Cu sare și suflet, Gabriella și Boróka</p>`]],footer:'Vă dorim o ședere frumoasă și liniștită.'},en:{hero:'Welcome to Salt & Soul',intro:'Everything you need for a peaceful stay in Sovata.',nav:['Arrival','Parking','Amenities','Breakfast · Ciuperca Mică','SPA','Explore','Contact'],sections:[['Arrival and departure',`<div class="grid"><div class="card"><div class="muted">CHECK-IN</div><div class="big">2 PM–midnight</div><p>Self check-in. There is no permanent reception desk.</p></div><div class="card"><div class="muted">CHECK-OUT</div><div class="big">By 11 AM</div><p>Leave the room key inside the room door when departing.</p></div></div><h3>Entering the villa</h3><p>Enter the access code sent to you separately on the intercom. Wait about two seconds for the soft signal, then open the door. To exit, press the black button above the handle.</p><p>Your key is inside your room door. Your room name and entry code will be sent in your arrival message.</p>`],['Parking',`<div class="card parking-map"><img src="parking.jpg" alt="Parking layout Salt & Soul" loading="lazy"><p class="muted">Hartă orientativă / Parking layout / Parkolási vázlat</p></div><p>Parking spaces are available in front of and behind the villa. The rear parking area is narrower. Please park within the marked lines so there is room for everyone.</p><p>If you have an assigned space, we will send you its number separately.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Salt%20and%20Soul%20Sovata">Open map</a>`],['Amenities and useful information',`<div class="grid"><div class="card"><h3>WiFi</h3><p>Network: <strong>Salt&Soul</strong><br>Password: <strong>salt2025</strong></p><button class="btn light" onclick="copyWifi()">Copy password</button></div><div class="card"><h3>Shared spaces</h3><div class="shared-gallery"><div class="card"><img src="kitchen.jpg" alt="Shared kitchen" loading="lazy"><div class="muted">Shared kitchen</div></div><div class="card"><img src="lounge.jpg" alt="Shared lounge" loading="lazy"><div class="muted">Shared lounge</div></div></div><p>Enjoy the shared living room on the ground floor, complimentary coffee and hot chocolate, and the rear terrace.</p></div></div><h3>Housekeeping and quiet</h3><p>Please contact us on WhatsApp for cleaning and towel-change arrangements. Kindly respect other guests' peace and quiet.</p>`],['Breakfast at Ciuperca Mică Restaurant',`<div class="photo-carousel" data-carousel><div class="slides"><img src="ciuperca-01-exterior.jpg" alt="Ciuperca Mică – restaurant and breakfast photo 1" loading="lazy"><img src="ciuperca-02-terrace.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 2" loading="lazy"><img src="ciuperca-03-breakfast.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 3" loading="lazy"><img src="ciuperca-04-salmon.jpg" alt="Ciuperca Mică – restaurant and breakfast photo 4" loading="lazy"><img src="ciuperca-05-bruschetta.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 5" loading="lazy"></div><button class="slide-arrow prev" type="button" aria-label="Previous photo" onclick="moveSlide(this,-1)">‹</button><button class="slide-arrow next" type="button" aria-label="Next photo" onclick="moveSlide(this,1)">›</button><div class="slide-dots" aria-label="Photo selection"></div></div><span class="tag">Depending on your booking</span><p>If breakfast is included in your reservation, it is served à la carte at our partner restaurant <strong>Ciuperca Mică</strong>, next to Bear Lake, around a 3–4 minute walk away.</p><p><strong>Usual hours: 9 AM–noon.</strong> If you would like to eat earlier, please let us know. Your breakfast QR code is sent separately.</p><div class="warning">Breakfast is served outside the villa and is included only when stated in your booking.</div>`],['SPA and relaxation',`<span class="tag">Subject to your package</span><div class="grid"><div class="card"><div class="photo-carousel" data-carousel><div class="slides"><img src="pool.jpg" alt="Hotel Pacsirta pool" loading="lazy"><img src="sauna.jpg" alt="Hotel Pacsirta sauna" loading="lazy"></div><button class="slide-arrow prev" type="button" aria-label="Previous photo" onclick="moveSlide(this,-1)">‹</button><button class="slide-arrow next" type="button" aria-label="Next photo" onclick="moveSlide(this,1)">›</button><div class="slide-dots" aria-label="Photo selection"></div></div><h3>Hotel Pacsirta SPA</h3><p>A smaller, peaceful spa approximately 200 m from the villa. If included in your booking, the physical voucher is in your room and must be handed to the hotel reception. Access duration depends on your reservation.</p></div><div class="card"><div class="media-frame spa-image-frame"><img class="spa-still" src="praid.jpg" alt="Wellness Praid" loading="lazy"></div><h3>Wellness Praid</h3><p>A larger wellness alternative when switching is available for your reservation. A digital voucher may be provided.</p></div></div><p>SPA facilities are not located inside the villa. Message us to check available options.</p>`],['Explore Sovata',`<div class="grid"><div class="card"><img class="photo" src="lake.jpg" alt="Lacul Ursu, Sovata" loading="lazy"><h3>Bear Lake (Lacul Ursu)</h3><p>Take a scenic walk around one of Sovata's best-known natural attractions.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Lacul+Ursu+Sovata">Map</a></div><div class="card"><img class="photo" src="train.jpg" alt="Mocănița Sovata" loading="lazy"><h3>Mocănița Sovata</h3><p>Enjoy a heritage train excursion. Check the current schedule before visiting.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Mocanita+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="drumul-sarii.jpg" alt="Salt Trail (Drumul Sării)" loading="lazy"><h3>Salt Trail (Drumul Sării)</h3><p>A nature trail through woodland, salt formations and lakes. The Salt educational trail is approximately 970 metres long.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Drumul+Sarii+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="lacuri-rosu-verde.jpg" alt="Red and Green Lakes" loading="lazy"><h3>Red and Green Lakes</h3><p>Two salt lakes to admire from designated paths near the Salt Mountain.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Rosu+Lacul+Verde+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="muntele-sare.jpg" alt="Salt Mountain" loading="lazy"><h3>Salt Mountain</h3><p>Discover natural salt formations near Bear Lake. Please stay on marked paths.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Muntele+de+Sare+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="belvedere.jpg" alt="Belvedere Tower" loading="lazy"><h3>Belvedere Tower</h3><p>A viewpoint overlooking Sovata and the surrounding hills. The walk includes an uphill section.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Turnul+Belvedere+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="tivoli.jpg" alt="Lake Tivoli" loading="lazy"><h3>Lake Tivoli</h3><p>A peaceful place for a nature walk. Available activities may vary by season.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Tivoli+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="alunis.jpg" alt="Lake Aluniș" loading="lazy"><h3>Lake Aluniș</h3><p>A salt lake close to Bear Lake, ideal to explore on foot.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Alunis+Sovata">Map</a></div></div>`],['Here to help',`<p>Need anything during your stay? Contact us by phone or WhatsApp.</p><a class="btn" href="https://wa.me/40749250933">Message on WhatsApp</a><a class="btn light" href="tel:+40749250933">Call: 0749 250 933</a><a class="btn light" href="mailto:saltandsoul.sovata@gmail.com">Email</a><p class="muted">With salt and soul, Gabriella and Boróka</p>`]],footer:'Wishing you a relaxing stay.'},hu:{hero:'Üdvözlünk a Salt & Soul villában!',intro:'Minden hasznos információ egy helyen a nyugodt szovátai pihenéshez.',nav:['Érkezés','Parkolás','Felszereltség','Reggeli · Ciuperca Mică','SPA','Programok','Kapcsolat'],sections:[['Érkezés és távozás',`<div class="grid"><div class="card"><div class="muted">BEJELENTKEZÉS</div><div class="big">14:00–24:00</div><p>Önálló bejelentkezés. Állandó recepció nincs.</p></div><div class="card"><div class="muted">KIJELENTKEZÉS</div><div class="big">11:00-ig</div><p>Távozáskor hagyd a szobakulcsot a szobaajtó belső oldalán.</p></div></div><h3>Belépés a villába</h3><p>A kaputelefonon írd be a külön üzenetben kapott belépőkódot. Várj körülbelül két másodpercet a halk jelzésig, majd nyisd ki az ajtót. Kilépéskor nyomd meg a kilincs feletti fekete gombot.</p><p>A kulcs a szobaajtó belső oldalán található. A szoba nevét és a belépőkódot érkezés előtt külön elküldjük.</p>`],['Parkolás',`<div class="card parking-map"><img src="parking.jpg" alt="Parking layout Salt & Soul" loading="lazy"><p class="muted">Hartă orientativă / Parking layout / Parkolási vázlat</p></div><p>A villa előtt és mögött is vannak parkolóhelyek. A hátsó parkoló szűkebb. Kérünk, hogy a felfestett vonalak között parkolj, így mindenkinek marad hely.</p><p>Ha kijelölt parkolóhelyed van, annak számát külön elküldjük.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Salt%20and%20Soul%20Sovata">Térkép megnyitása</a>`],['Felszereltség és hasznos tudnivalók',`<div class="grid"><div class="card"><h3>WiFi</h3><p>Hálózat: <strong>Salt&Soul</strong><br>Jelszó: <strong>salt2025</strong></p><button class="btn light" onclick="copyWifi()">Jelszó másolása</button></div><div class="card"><h3>Közös terek</h3><div class="shared-gallery"><div class="card"><img src="kitchen.jpg" alt="Közös konyha" loading="lazy"><div class="muted">Közös konyha</div></div><div class="card"><img src="lounge.jpg" alt="Közös nappali" loading="lazy"><div class="muted">Közös nappali</div></div></div><p>A földszinten közös nappali, ingyenes kávé és forró csokoládé vár. A villa hátsó terasza is használható.</p></div></div><h3>Takarítás és nyugalom</h3><p>A takarítással és törölközőcserével kapcsolatban írj nekünk WhatsAppon. Kérünk, figyelj a többi vendég nyugalmára.</p>`],['Reggeli a Ciuperca Mică étteremben',`<div class="photo-carousel" data-carousel><div class="slides"><img src="ciuperca-01-exterior.jpg" alt="Ciuperca Mică – restaurant and breakfast photo 1" loading="lazy"><img src="ciuperca-02-terrace.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 2" loading="lazy"><img src="ciuperca-03-breakfast.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 3" loading="lazy"><img src="ciuperca-04-salmon.jpg" alt="Ciuperca Mică – restaurant and breakfast photo 4" loading="lazy"><img src="ciuperca-05-bruschetta.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 5" loading="lazy"></div><button class="slide-arrow prev" type="button" aria-label="Previous photo" onclick="moveSlide(this,-1)">‹</button><button class="slide-arrow next" type="button" aria-label="Next photo" onclick="moveSlide(this,1)">›</button><div class="slide-dots" aria-label="Photo selection"></div></div><span class="tag">Foglalástól függően</span><p>Ha a foglalás tartalmaz reggelit, azt partneréttermünkben, a <strong>Ciuperca Mică (Kicsigomba)</strong> étteremben szolgálják fel, a Medve-tó mellett, körülbelül 3–4 perc sétára a villától. A reggeli à la carte rendszerű.</p><p><strong>Szokásos időpont: 9:00–12:00.</strong> Ha korábban szeretnél reggelizni, jelezd nekünk. A reggelihez szükséges QR-kódot külön küldjük el.</p><div class="warning">A reggeli nem a villa épületében van, és csak akkor tartozik a szálláshoz, ha a foglalás tartalmazza.</div>`],['SPA és wellness',`<span class="tag">A foglalás szerinti csomagban</span><div class="grid"><div class="card"><div class="photo-carousel" data-carousel><div class="slides"><img src="pool.jpg" alt="Hotel Pacsirta pool" loading="lazy"><img src="sauna.jpg" alt="Hotel Pacsirta sauna" loading="lazy"></div><button class="slide-arrow prev" type="button" aria-label="Previous photo" onclick="moveSlide(this,-1)">‹</button><button class="slide-arrow next" type="button" aria-label="Next photo" onclick="moveSlide(this,1)">›</button><div class="slide-dots" aria-label="Photo selection"></div></div><h3>Hotel Pacsirta SPA</h3><p>Kisebb, nyugodt wellnessrészleg körülbelül 200 méterre. Ha a csomagod tartalmazza, a fizikai voucher a szobában található, ezt a hotel recepcióján kell leadni. A belépés időtartama a foglalástól függ.</p></div><div class="card"><div class="media-frame spa-image-frame"><img class="spa-still" src="praid.jpg" alt="Wellness Praid" loading="lazy"></div><h3>Wellness Praid</h3><p>Nagyobb wellnessközpont, amely bizonyos foglalásoknál alternatívaként választható. Az elektronikus vouchert külön küldjük.</p></div></div><p>A SPA nem a villa épületében található. A lehetőségekről kérdezz minket üzenetben.</p>`],['Fedezd fel Szovátát',`<div class="grid"><div class="card"><img class="photo" src="lake.jpg" alt="Lacul Ursu, Sovata" loading="lazy"><h3>Medve-tó</h3><p>A tó körüli séta Szováta egyik legszebb, könnyen elérhető programja.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Lacul+Ursu+Sovata">Térkép</a></div><div class="card"><img class="photo" src="train.jpg" alt="Szovátai kisvasút" loading="lazy"><h3>Szovátai Mocănița</h3><p>Hangulatos kisvasutas kirándulás. Indulás előtt ellenőrizd az aktuális menetrendet.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Mocanita+Sovata">Térkép</a></div><div class="card attraction-card"><img class="attraction-photo" src="drumul-sarii.jpg" alt="Só útja (Drumul Sării)" loading="lazy"><h3>Só útja (Drumul Sării)</h3><p>Természeti tanösvény erdőn, sós képződmények és tavak mellett. A sóösvény körülbelül 970 méteres.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Drumul+Sarii+Sovata">Térkép</a></div><div class="card attraction-card"><img class="attraction-photo" src="lacuri-rosu-verde.jpg" alt="Vörös-tó és Zöld-tó" loading="lazy"><h3>Vörös-tó és Zöld-tó</h3><p>Két sóstó, amelyeket a kijelölt sétányokról lehet megtekinteni, a Sóhegy közelében.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Rosu+Lacul+Verde+Sovata">Térkép</a></div><div class="card attraction-card"><img class="attraction-photo" src="muntele-sare.jpg" alt="Sóhegy" loading="lazy"><h3>Sóhegy</h3><p>Különleges természetes sóképződmények a Medve-tó közelében. Maradj a kijelölt ösvényeken.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Muntele+de+Sare+Sovata">Térkép</a></div><div class="card attraction-card"><img class="attraction-photo" src="belvedere.jpg" alt="Kilátótorony" loading="lazy"><h3>Kilátótorony</h3><p>Szép panoráma Szovátára és a környező dombokra. A feljutáshoz emelkedőn kell sétálni.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Turnul+Belvedere+Sovata">Térkép</a></div><div class="card attraction-card"><img class="attraction-photo" src="tivoli.jpg" alt="Tivoli-tó" loading="lazy"><h3>Tivoli-tó</h3><p>Nyugodt hely egy természetközeli sétához. A programlehetőségek szezononként változhatnak.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Tivoli+Sovata">Térkép</a></div><div class="card attraction-card"><img class="attraction-photo" src="alunis.jpg" alt="Mogyorósi-tó (Aluniș)" loading="lazy"><h3>Mogyorósi-tó (Aluniș)</h3><p>A Medve-tó közelében található sóstó, amely gyalog is könnyen felfedezhető.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Alunis+Sovata">Térkép</a></div></div>`],['Segítünk, ha szükséged van rá',`<p>Ha kérdésed van a tartózkodás alatt, telefonon vagy WhatsAppon elérsz minket.</p><a class="btn" href="https://wa.me/40749250933">WhatsApp üzenet</a><a class="btn light" href="tel:+40749250933">Hívás: 0749 250 933</a><a class="btn light" href="mailto:saltandsoul.sovata@gmail.com">Email</a><p class="muted">Sóval és lélekkel, Gabriella és Boróka</p>`]],footer:'Kellemes, nyugodt pihenést kívánunk!'}};
function setSlide(carousel,index){const images=carousel.querySelectorAll('.slides img');const n=images.length;index=(index+n)%n;carousel.dataset.index=index;carousel.querySelector('.slides').style.transform=`translateX(-${index*100}%)`;carousel.querySelectorAll('.slide-dot').forEach((dot,i)=>{dot.classList.toggle('active',i===index);dot.setAttribute('aria-pressed',String(i===index));});}function moveSlide(button,direction){const carousel=button.closest('[data-carousel]');setSlide(carousel,Number(carousel.dataset.index||0)+direction)}function frameCarousels(){document.querySelectorAll('[data-carousel]').forEach(carousel=>{if(carousel.parentElement.classList.contains('media-frame'))return;const frame=document.createElement('div');frame.className='media-frame';carousel.parentNode.insertBefore(frame,carousel);frame.appendChild(carousel)})}function initCarousels(){document.querySelectorAll('[data-carousel]').forEach(carousel=>{const n=carousel.querySelectorAll('.slides img').length;const dots=carousel.querySelector('.slide-dots');dots.innerHTML='';for(let i=0;i<n;i++){const dot=document.createElement('button');dot.type='button';dot.className='slide-dot';dot.setAttribute('aria-label',`Photo ${i+1} of ${n}`);dot.addEventListener('click',()=>setSlide(carousel,i));dots.appendChild(dot)}setSlide(carousel,0);let startX=null;carousel.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});carousel.addEventListener('touchend',e=>{if(startX!==null){const delta=e.changedTouches[0].clientX-startX;if(Math.abs(delta)>45)setSlide(carousel,Number(carousel.dataset.index||0)+(delta<0?1:-1));startX=null}},{passive:true})})}function setLang(lang){const d=data[lang];document.documentElement.lang=lang;document.getElementById('hero').textContent=d.hero;document.getElementById('intro').textContent=d.intro;document.getElementById('footertext').textContent=d.footer;document.getElementById('nav').innerHTML=d.nav.map((x,i)=>`<a href="#s${i}">${x}</a>`).join('');document.getElementById('content').innerHTML=d.sections.map((s,i)=>`<section id="s${i}"><h2>${s[0]}</h2>${s[1]}</section>`).join('');frameCarousels();initCarousels();for(const l of ['ro','en','hu'])document.getElementById(l).classList.toggle('active',l===lang);try{localStorage.setItem('ss-lang',lang)}catch(e){}}function copyWifi(){if(navigator.clipboard)navigator.clipboard.writeText('salt2025');else prompt('WiFi','salt2025')}let initial='ro';try{initial=localStorage.getItem('ss-lang')||'ro'}catch(e){}setLang(data[initial]?initial:'ro');</script></body></html>
