<!doctype html>
<html lang="ro">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>Salt & Soul | Guest Guide</title>
    <style>
        :root {
            --green: #233b32;
            --cream: #faf8f3;
            --sage: #e8eee8;
            --gold: #b49b70
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--green);
            font: 16px/1.6 system-ui, -apple-system, sans-serif
        }

        header {
            background: linear-gradient(90deg, rgba(18, 32, 27, .79), rgba(18, 32, 27, .32)), url("villa.jpg") center 48%/cover no-repeat;
            min-height: 490px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 42px 18px 48px
        }

        header img {
            width: 94px;
            height: 94px;
            object-fit: contain;
            border-radius: 5px;
            background: white;
            padding: 3px;
            box-shadow: 0 5px 22px #0004
        }

        h1,
        h2 {
            font-family: Georgia, serif;
            font-weight: 400
        }

        h1 {
            font-size: clamp(36px, 7vw, 62px);
            margin: 10px 0
        }

        h2 {
            font-size: 31px;
            margin: 0 0 14px
        }

        p {
            margin: 8px 0 14px
        }

        .sub {
            opacity: .85
        }

        .languages {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0
        }

        .languages button {
            border: 1px solid #ffffff80;
            border-radius: 22px;
            background: transparent;
            color: white;
            padding: 9px 16px;
            cursor: pointer
        }

        .languages button.active {
            background: white;
            color: var(--green)
        }

        nav {
            position: sticky;
            top: 0;
            background: #faf8f3f5;
            z-index: 5;
            display: flex;
            gap: 8px;
            overflow: auto;
            padding: 13px max(15px, calc((100vw - 1000px)/2));
            border-bottom: 1px solid #e0e3dc
        }

        nav a {
            white-space: nowrap;
            color: var(--green);
            text-decoration: none;
            border: 1px solid #dce2d9;
            background: white;
            border-radius: 20px;
            padding: 7px 13px;
            font-size: 13px
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 0 20px 60px
        }

        section {
            padding: 36px 0;
            border-bottom: 1px solid #e0e2dc
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px
        }

        .card {
            background: white;
            border: 1px solid #e3e6df;
            border-radius: 16px;
            padding: 22px
        }

        .muted {
            color: #64766b;
            font-size: 14px
        }

        .big {
            font-size: 30px;
            font-family: Georgia, serif
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 9px;
            background: var(--green);
            color: white;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            font: inherit;
            margin: 6px 5px 4px 0
        }

        .light {
            background: #e5ece4;
            color: var(--green)
        }

        .visual {
            border-radius: 16px;
            background: linear-gradient(120deg, #e3e9df, #cedcd1);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #526d5d;
            text-align: center;
            padding: 20px
        }

        .tag {
            display: inline-block;
            border-radius: 20px;
            background: #e7eee6;
            padding: 5px 12px;
            font-size: 13px
        }

        .warning {
            background: #f2eee3;
            padding: 15px 20px;
            border-radius: 12px
        }

        footer {
            background: var(--green);
            color: white;
            text-align: center;
            padding: 32px 20px
        }

        footer a {
            color: white
        }

        .floating {
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: #285b43;
            color: white;
            padding: 12px 17px;
            border-radius: 40px;
            text-decoration: none;
            box-shadow: 0 5px 20px #0003;
            z-index: 10
        }

        @media(max-width:650px) {
            .grid {
                grid-template-columns: 1fr
            }

            section {
                padding: 28px 0
            }

            h2 {
                font-size: 28px
            }
        }

        .photo {
            display: block;
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-radius: 12px;
            margin: 10px 0 18px
        }

        .photo-pair {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 12px;
            margin: 20px 0
        }

        .photo-pair img {
            width: 100%;
            height: 255px;
            object-fit: cover;
            border-radius: 14px
        }

        .photo-pair img:nth-child(2) {
            height: 210px;
            align-self: center
        }

        .card .photo {
            height: 180px;
            margin: 0 0 15px
        }

        @media(max-width:650px) {
            .photo-pair img {
                height: 185px
            }

            .photo-pair img:nth-child(2) {
                height: 155px
            }

            header {
                min-height: 420px
            }
        }

        .photo-carousel {
            position: relative;
            width: 100%;
            max-width: 960px;
            margin: 20px 0 24px;
            overflow: hidden;
            border-radius: 18px;
            background: #e8eee8;
            aspect-ratio: 16/9
        }

        .photo-carousel .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform .4s ease;
            will-change: transform
        }

        .photo-carousel .slides img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex: 0 0 100%;
            display: block
        }

        .slide-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 44px;
            width: 44px;
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 50%;
            background: rgba(255, 255, 255, .88);
            color: #233b32;
            font-size: 32px;
            line-height: 32px;
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: 0 2px 12px #0002
        }

        .slide-arrow.prev {
            left: 14px
        }

        .slide-arrow.next {
            right: 14px
        }

        .slide-arrow:hover {
            background: white
        }

        .slide-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 9px;
            background: #182b2380;
            border-radius: 20px;
            padding: 9px 12px
        }

        .slide-dot {
            width: 9px;
            height: 9px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: #ffffff88;
            cursor: pointer
        }

        .slide-dot.active {
            background: white;
            transform: scale(1.18)
        }

        @media(max-width:650px) {
            .photo-carousel {
                aspect-ratio: 4/3
            }

            .slide-arrow {
                width: 38px;
                height: 38px;
                font-size: 27px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .photo-carousel .slides {
                transition: none
            }
        }

        /* Consistent softly framed image galleries */
        .media-frame {
            background: #fff;
            border: 1px solid #e3e6df;
            border-radius: 20px;
            padding: 22px;
            margin: 20px 0 24px;
            box-shadow: 0 2px 10px rgba(35, 59, 50, .025)
        }

        .media-frame .photo-carousel {
            margin: 0;
            max-width: none;
            border-radius: 15px;
            background: #f0f2ed
        }

        .media-frame .slides img {
            border-radius: 15px
        }

        @media(max-width:650px) {
            .media-frame {
                padding: 15px;
                border-radius: 19px;
                margin: 17px 0 22px
            }

            .media-frame .photo-carousel,
            .media-frame .slides img {
                border-radius: 13px
            }
        }

        /* Unified spa cards, shared-space photographs and parking illustration */
        .parking-map {
            padding: 14px;
            max-width: 700px;
            margin: 15px auto 22px;
            text-align: center
        }

        .parking-map img {
            display: block;
            width: 100%;
            max-height: 520px;
            object-fit: contain;
            border-radius: 12px;
            background: #faf8f3
        }

        .parking-map p {
            margin: 9px 0 0
        }

        .shared-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px
        }

        .shared-gallery .card {
            padding: 8px;
            border-radius: 12px
        }

        .shared-gallery img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            display: block
        }

        .shared-gallery .muted {
            padding: 5px 3px 0
        }

        /* The Pacsirta carousel has exactly the same media dimensions as the Praid photograph */
        .grid>.card>.photo-carousel {
            width: 100%;
            height: 180px;
            aspect-ratio: auto;
            margin: 0 0 15px;
            border-radius: 12px;
            max-width: none
        }

        .grid>.card>.photo-carousel .slides img {
            height: 100%;
            width: 100%;
            object-fit: cover
        }

        .grid>.card>.photo-carousel .slide-arrow {
            width: 32px;
            height: 32px;
            font-size: 24px;
            line-height: 1
        }

        .grid>.card>.photo-carousel .slide-arrow.prev {
            left: 7px
        }

        .grid>.card>.photo-carousel .slide-arrow.next {
            right: 7px
        }

        .grid>.card>.photo-carousel .slide-dots {
            bottom: 8px;
            padding: 6px 9px;
            gap: 7px
        }

        .grid>.card>.photo-carousel .slide-dot {
            width: 7px;
            height: 7px
        }

        .attraction-card {
            display: flex;
            flex-direction: column
        }

        .attraction-card .btn {
            align-self: flex-start;
            margin-top: auto
        }

        .attraction-icon {
            font-family: Georgia, serif;
            font-size: 30px;
            color: #779283;
            background: #edf2ed;
            border-radius: 12px;
            height: 100px;
            display: grid;
            place-items: center;
            margin-bottom: 13px
        }

        @media(max-width:650px) {
            .shared-gallery {
                grid-template-columns: 1fr 1fr
            }

            .shared-gallery img {
                height: 105px
            }
        }

        /* Equal media and card geometry for the two SPA partners */
        #s4>.grid {
            align-items: stretch
        }

        #s4>.grid>.card {
            display: flex;
            flex-direction: column;
            min-width: 0
        }

        #s4 .media-frame {
            width: 100%;
            height: 226px;
            min-height: 226px;
            padding: 15px;
            margin: 0 0 18px;
            border: 1px solid #e3e6df;
            border-radius: 19px;
            overflow: hidden;
            background: #fff;
            display: block
        }

        #s4 .media-frame .photo-carousel {
            width: 100%;
            height: 100%;
            aspect-ratio: auto;
            margin: 0;
            border-radius: 13px;
            overflow: hidden
        }

        #s4 .media-frame .slides,
        #s4 .media-frame .slides img {
            height: 100%
        }

        #s4 .media-frame .spa-still {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 13px
        }

        #s4 .card h3 {
            margin: 0 0 13px
        }

        #s4 .card p {
            margin: 0
        }

        /* Consistent images in all destination cards */
        #s5 .attraction-photo,
        #s5 .card>.photo {
            display: block;
            width: 100%;
            height: 180px;
            object-fit: cover;
            object-position: center;
            border-radius: 12px;
            margin: 0 0 15px;
            background: #e8eee8
        }

        #s5 .grid>.card {
            display: flex;
            flex-direction: column;
            min-width: 0
        }

        #s5 .grid>.card .btn {
            align-self: flex-start;
            margin-top: auto
        }

        @media(max-width:650px) {
            #s4 .media-frame {
                height: 230px;
                min-height: 230px
            }

            #s5 .attraction-photo,
            #s5 .card>.photo {
                height: 205px
            }
        }

        /* Breakfast gallery: unified image proportions and quiet framing */
        #s3>.photo-carousel {
            background: #fff;
            border: 1px solid #e3e6df;
            padding: 14px;
            aspect-ratio: 16/9;
            border-radius: 20px;
            overflow: hidden
        }

        #s3>.photo-carousel .slides {
            border-radius: 13px;
            overflow: hidden
        }

        #s3>.photo-carousel .slides img {
            object-fit: cover;
            object-position: center
        }

        #s3>.photo-carousel .slide-arrow.prev {
            left: 26px
        }

        #s3>.photo-carousel .slide-arrow.next {
            right: 26px
        }

        @media(max-width:650px) {
            #s3>.photo-carousel {
                aspect-ratio: 4/3;
                padding: 9px
            }

            #s3>.photo-carousel .slide-arrow.prev {
                left: 17px
            }

            #s3>.photo-carousel .slide-arrow.next {
                right: 17px
            }
        }

        /* Compact, centred breakfast gallery; preserve the existing visual language. */
        #s3>.media-frame {
            width: min(100%, 740px);
            margin: 20px auto 24px;
            padding: 16px
        }

        #s3>.media-frame .photo-carousel {
            width: 100%;
            aspect-ratio: 16/9;
            height: auto
        }

        #s3>.media-frame .slides img {
            object-fit: cover;
            object-position: center
        }

        @media(max-width:650px) {
            #s3>.media-frame {
                padding: 10px;
                width: 100%
            }

            #s3>.media-frame .photo-carousel {
                aspect-ratio: 4/3
            }
        }

        /* Raise the omelette composition within the breakfast crop. */
        #s3 .slides img[src="breakfast-omelette.jpg"] {
            object-position: center 76%
        }

        /* Guest journey, accessible touch targets and operational modules */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 84px
        }

        button,
        a {
            touch-action: manipulation
        }

        button:focus-visible,
        a:focus-visible,
        summary:focus-visible {
            outline: 3px solid #b49b70;
            outline-offset: 3px
        }

        nav a {
            min-height: 42px;
            display: inline-flex;
            align-items: center
        }

        .btn {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center
        }

        .journey-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px
        }

        .journey-step {
            background: #fff;
            border: 1px solid #e3e6df;
            border-radius: 15px;
            padding: 18px
        }

        .journey-step .num {
            display: inline-flex;
            background: #e8eee8;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            align-items: center;
            justify-content: center;
            font-weight: 700
        }

        .journey-step h3 {
            font-size: 17px;
            margin: 10px 0 5px
        }

        .journey-step p {
            font-size: 14px;
            margin: 0
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0
        }

        .quick-links a {
            background: #e8eee8;
            color: #233b32;
            padding: 11px 14px;
            border-radius: 30px;
            text-decoration: none;
            min-height: 44px
        }

        .faq details {
            background: white;
            border: 1px solid #e3e6df;
            border-radius: 13px;
            padding: 14px 17px;
            margin: 10px 0
        }

        .faq summary {
            cursor: pointer;
            font-weight: 600;
            min-height: 28px
        }

        .faq details p {
            margin: 12px 0 2px
        }

        .clean-actions {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin: 12px 0 22px
        }

        .alert-info {
            border-left: 4px solid #b49b70;
            background: #f1eee7;
            border-radius: 9px;
            padding: 14px 17px;
            margin: 14px 0
        }

        .review-note {
            font-size: 13px;
            color: #64766b
        }

        #s2 h3 {
            margin-top: 22px
        }

        @media(max-width:700px) {
            .journey-grid {
                grid-template-columns: 1fr
            }

            .journey-step {
                padding: 14px
            }

            header {
                min-height: 360px
            }

            main {
                padding: 0 15px 50px
            }

            nav {
                padding: 10px 12px
            }

            .floating {
                right: 10px;
                bottom: 10px
            }

            .grid .card {
                padding: 18px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            html {
                scroll-behavior: auto
            }
        }

        .itinerary {
            margin-top: 32px
        }

        .itinerary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px
        }

        .itinerary-grid .card {
            height: 100%
        }

        .itinerary-grid h3 {
            margin-top: 0
        }

        @media(max-width:700px) {
            .itinerary-grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <header><img alt="Salt & Soul" src="logo.png">
        <div class="languages"><button onclick="setLang('ro')" id="ro">Română</button><button onclick="setLang('en')"
                id="en">English</button><button onclick="setLang('hu')" id="hu">Magyar</button></div>

    </footer><a class="floating" href="https://wa.me/40749250933">WhatsApp</a>
    <script>
        const data = {ro: {hero: 'Bine ați venit!', intro: 'Tot ce aveți nevoie pentru o ședere liniștită la Sovata.', nav: ['Sosire', 'Parcare', 'Facilități', 'Mic dejun', 'SPA', 'De explorat', 'Contact'], sections: [['Sosire și plecare', `<div class="grid"><div class="card"><div class="muted">CHECK-IN</div><div class="big">14:00–24:00</div><p>Accesul se face prin self check-in. Vila nu are recepție permanentă.</p></div><div class="card"><div class="muted">CHECK-OUT</div><div class="big">Până la 10:00</div><p>La plecare, lăsați cheia în ușa camerei, pe interior.</p></div></div><h3>Accesul în vilă</h3><p>Introduceți codul de acces primit separat pe interfon. Așteptați aproximativ două secunde, până la semnalul discret, apoi deschideți ușa. La ieșire, apăsați butonul negru deasupra clanței.</p><p>Cheia camerei se află în ușă, pe interior. Numele camerei și codul de acces vi se comunică în mesajul de sosire.</p>`], ['Parcare', `<div class="card parking-map"><img src="parking-layout.png" alt="Parking layout Salt & Soul" loading="lazy"><p class="muted">Hartă orientativă / Parking layout / Parkolási vázlat</p></div><p>Locurile de parcare se află în fața și în spatele vilei. Parcarea din spate este mai îngustă. Vă rugăm să parcați între liniile marcate, astfel încât să rămână loc pentru toate mașinile.</p><p>Dacă aveți un loc alocat, numărul acestuia vă va fi comunicat separat.</p><a class="btn light" target="_blank" href="https://maps.app.goo.gl/nrSiqXES8SHTe38C9">Deschideți harta</a>`], ['Facilități și informații utile', `<div class="grid"><div class="card"><h3>WiFi</h3><p>Rețea: <strong>Salt&Soul</strong><br>Parolă: <strong>salt2025</strong></p><button class="btn light" onclick="copyWifi()">Copiază parola</button><p style="margin-top:14px">Codul ușii de la intrarea principală: <strong>1212#</strong></p></div><div class="card"><h3>Spații comune</h3><div class="shared-gallery"><div class="card"><img src="kitchen.jpg" alt="Bucătăria comună" loading="lazy"><div class="muted">Bucătăria comună</div></div><div class="card"><img src="lounge.jpg" alt="Livingul comun" loading="lazy"><div class="muted">Livingul comun</div></div></div><p>La parter găsiți livingul comun, cafea și ciocolată caldă din partea casei. Puteți folosi și terasa din spatele vilei.</p></div></div><h3>Curățenia camerei</h3><p>Intrăm zilnic în camere pentru a face curățenie, începând cu ora 10:00. Lenjeria de pat se schimbă la fiecare 3 zile. Dacă doriți schimbarea prosoapelor sau a lenjeriei, ne puteți contacta pe WhatsApp.</p><div class="clean-actions" data-clean-actions></div>`], ['Mic dejun', `<div class="photo-carousel" data-carousel><div class="slides"><img src="ciuperca-01-exterior.jpg" alt="Ciuperca Mică – restaurant and breakfast photo 1" loading="lazy"><img src="ciuperca-02-terrace.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 2" loading="lazy"><img src="ciuperca-03-breakfast.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 3" loading="lazy"><img src="ciuperca-04-salmon.jpg" alt="Ciuperca Mică – restaurant and breakfast photo 4" loading="lazy"><img src="ciuperca-05-bruschetta.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 5" loading="lazy"></div><button class="slide-arrow prev" type="button" aria-label="Previous photo" onclick="moveSlide(this,-1)">‹</button><button class="slide-arrow next" type="button" aria-label="Next photo" onclick="moveSlide(this,1)">›</button><div class="slide-dots" aria-label="Photo selection"></div></div><span class="tag">În funcție de rezervare</span><p>Dacă rezervarea include micul dejun, acesta se servește la restaurantul partener <strong>Ciuperca Mică</strong>, lângă Lacul Ursu, la aproximativ 3–4 minute de mers pe jos. Micul dejun este à la carte.</p><p><strong>Programul micului dejun: 10:00–12:00.</strong> Dacă doriți să veniți mai devreme, vă rugăm să ne anunțați. Codul QR necesar este trimis separat.</p><div class="warning">Restaurantul nu se află în clădirea vilei. Micul dejun este inclus doar dacă apare în rezervarea dumneavoastră.</div>`], ['SPA și relaxare', `<span class="tag">Disponibil în funcție de pachet</span><div class="grid"><div class="card"><div class="photo-carousel" data-carousel><div class="slides"><img src="pool.jpg" alt="Hotel Pacsirta pool" loading="lazy"><img src="sauna.jpg" alt="Hotel Pacsirta sauna" loading="lazy"></div><button class="slide-arrow prev" type="button" aria-label="Previous photo" onclick="moveSlide(this,-1)">‹</button><button class="slide-arrow next" type="button" aria-label="Next photo" onclick="moveSlide(this,1)">›</button><div class="slide-dots" aria-label="Photo selection"></div></div><h3>Hotel Pacsirta SPA</h3><p>Un spa mai intim, la aproximativ 200 m de vilă. Dacă pachetul include accesul, voucherul fizic se găsește în cameră și se predă la recepția hotelului. Durata accesului depinde de rezervare.</p></div><div class="card"><div class="media-frame spa-image-frame"><img class="spa-still" src="praid.jpg" alt="Wellness Praid" loading="lazy"></div><h3>Wellness Praid</h3><p>O alternativă de wellness mai mare, atunci când schimbarea este disponibilă pentru rezervarea dumneavoastră. Voucherul poate fi transmis electronic.</p></div></div><p>SPA-ul nu se află în clădirea vilei. Contactați-ne pentru a verifica opțiunile disponibile.</p>`], ['Descoperiți Sovata', `<div class="grid"><div class="card"><img class="photo" src="lake.jpg" alt="Lacul Ursu, Sovata" loading="lazy"><h3>Lacul Ursu</h3><p>O plimbare în jurul lacului este una dintre cele mai plăcute modalități de a descoperi Sovata.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Lacul+Ursu+Sovata">Hartă</a></div><div class="card"><img class="photo" src="train.jpg" alt="Mocănița Sovata" loading="lazy"><h3>Mocănița Sovata</h3><p>O experiență cu trenul turistic, potrivită pentru o ieșire în zonă. Verificați programul înainte de plecare.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Mocanita+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="drumul-sarii.jpg" alt="Drumul Sării" loading="lazy"><h3>Drumul Sării</h3><p>Un traseu tematic prin pădure, printre lacuri și formațiuni de sare. Circuitul eco-didactic al Sării are aproximativ 970 m.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Drumul+Sarii+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="lacuri-rosu-verde.jpg" alt="Lacurile Roșu și Verde" loading="lazy"><h3>Lacurile Roșu și Verde</h3><p>Două lacuri sărate pe care le puteți admira de pe aleile amenajate, în apropierea Muntelui de Sare.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Rosu+Lacul+Verde+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="muntele-sare.jpg" alt="Muntele de Sare" loading="lazy"><h3>Muntele de Sare</h3><p>Descoperiți formațiunile naturale de sare din apropierea Lacului Ursu. Rămâneți pe potecile amenajate.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Muntele+de+Sare+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="belvedere.jpg" alt="Turnul Belvedere" loading="lazy"><h3>Turnul Belvedere</h3><p>Un punct de belvedere cu panoramă asupra stațiunii și dealurilor din jur.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Turnul+Belvedere+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="tivoli.jpg" alt="Lacul Tivoli" loading="lazy"><h3>Lacul Tivoli</h3><p>Un loc liniștit pentru o plimbare în natură. Activitățile disponibile pot varia în funcție de sezon.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Tivoli+Sovata">Hartă</a></div><div class="card attraction-card"><img class="attraction-photo" src="alunis.jpg" alt="Lacul Aluniș" loading="lazy"><h3>Lacul Aluniș</h3><p>Un lac sărat în apropierea Lacului Ursu, potrivit pentru a fi descoperit la pas.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Alunis+Sovata">Hartă</a></div></div>`], ['Contactați-ne oricând aveți nevoie', `<p>Dacă aveți întrebări în timpul șederii, ne puteți contacta telefonic sau pe WhatsApp.</p><a class="btn" href="https://wa.me/40749250933">Scrieți pe WhatsApp</a><a class="btn light" href="tel:+40749250933">Sunați: 0749 250 933</a><a class="btn light" href="mailto:saltandsoul.sovata@gmail.com">Email</a><p class="muted">Cu sare și suflet, Gabriella și Boróka</p>`]], footer: 'Vă dorim o ședere frumoasă și liniștită.'}, en: {hero: 'Welcome to Salt & Soul', intro: 'Everything you need for a peaceful stay in Sovata.', nav: ['Arrival', 'Parking', 'Amenities', 'Breakfast · Ciuperca Mică', 'SPA', 'Explore', 'Contact'], sections: [['Arrival and departure', `<div class="grid"><div class="card"><div class="muted">CHECK-IN</div><div class="big">2 PM–midnight</div><p>Self check-in. There is no permanent reception desk.</p></div><div class="card"><div class="muted">CHECK-OUT</div><div class="big">By 11 AM</div><p>Leave the room key inside the room door when departing.</p></div></div><h3>Entering the villa</h3><p>Enter the access code sent to you separately on the intercom. Wait about two seconds for the soft signal, then open the door. To exit, press the black button above the handle.</p><p>Your key is inside your room door. Your room name and entry code will be sent in your arrival message.</p>`], ['Parking', `<div class="card parking-map"><img src="parking-layout.png" alt="Parking layout Salt & Soul" loading="lazy"><p class="muted">Hartă orientativă / Parking layout / Parkolási vázlat</p></div><p>Parking spaces are available in front of and behind the villa. The rear parking area is narrower. Please park within the marked lines so there is room for everyone.</p><p>If you have an assigned space, we will send you its number separately.</p><a class="btn light" target="_blank" href="https://maps.app.goo.gl/nrSiqXES8SHTe38C9">Open map</a>`], ['Amenities and useful information', `<div class="grid"><div class="card"><h3>WiFi</h3><p>Network: <strong>Salt&Soul</strong><br>Password: <strong>salt2025</strong></p><button class="btn light" onclick="copyWifi()">Copy password</button><p style="margin-top:14px">Main entrance door code: <strong>1212#</strong></p></div><div class="card"><h3>Shared spaces</h3><div class="shared-gallery"><div class="card"><img src="kitchen.jpg" alt="Shared kitchen" loading="lazy"><div class="muted">Shared kitchen</div></div><div class="card"><img src="lounge.jpg" alt="Shared lounge" loading="lazy"><div class="muted">Shared lounge</div></div></div><p>Enjoy the shared living room on the ground floor, complimentary coffee and hot chocolate, and the rear terrace.</p></div></div><h3>Room cleaning</h3><p>We clean your room every day, starting at 10:00. Bed linen is changed every three days. If you would like fresh towels or a linen change, please contact us on WhatsApp.</p><div class="clean-actions" data-clean-actions></div>`], ['Breakfast', `<div class="photo-carousel" data-carousel><div class="slides"><img src="ciuperca-01-exterior.jpg" alt="Ciuperca Mică – restaurant and breakfast photo 1" loading="lazy"><img src="ciuperca-02-terrace.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 2" loading="lazy"><img src="ciuperca-03-breakfast.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 3" loading="lazy"><img src="ciuperca-04-salmon.jpg" alt="Ciuperca Mică – restaurant and breakfast photo 4" loading="lazy"><img src="ciuperca-05-bruschetta.jpeg" alt="Ciuperca Mică – restaurant and breakfast photo 5" loading="lazy"></div><button class="slide-arrow prev" type="button" aria-label="Previous photo" onclick="moveSlide(this,-1)">‹</button><button class="slide-arrow next" type="button" aria-label="Next photo" onclick="moveSlide(this,1)">›</button><div class="slide-dots" aria-label="Photo selection"></div></div><span class="tag">Depending on your booking</span><p>If breakfast is included in your reservation, it is served à la carte at our partner restaurant <strong>Ciuperca Mică</strong>, next to Bear Lake, around a 3–4 minute walk away.</p><p><strong>Breakfast hours: 10:00 AM–12:00 PM.</strong> If you would like to eat earlier, please let us know. Your breakfast QR code is sent separately.</p><div class="warning">Breakfast is served outside the villa and is included only when stated in your booking.</div>`], ['SPA and relaxation', `<span class="tag">Subject to your package</span><div class="grid"><div class="card"><div class="photo-carousel" data-carousel><div class="slides"><img src="pool.jpg" alt="Hotel Pacsirta pool" loading="lazy"><img src="sauna.jpg" alt="Hotel Pacsirta sauna" loading="lazy"></div><button class="slide-arrow prev" type="button" aria-label="Previous photo" onclick="moveSlide(this,-1)">‹</button><button class="slide-arrow next" type="button" aria-label="Next photo" onclick="moveSlide(this,1)">›</button><div class="slide-dots" aria-label="Photo selection"></div></div><h3>Hotel Pacsirta SPA</h3><p>A smaller, peaceful spa approximately 200 m from the villa. If included in your booking, the physical voucher is in your room and must be handed to the hotel reception. Access duration depends on your reservation.</p></div><div class="card"><div class="media-frame spa-image-frame"><img class="spa-still" src="praid.jpg" alt="Wellness Praid" loading="lazy"></div><h3>Wellness Praid</h3><p>A larger wellness alternative when switching is available for your reservation. A digital voucher may be provided.</p></div></div><p>SPA facilities are not located inside the villa. Message us to check available options.</p>`], ['Explore Sovata', `<div class="grid"><div class="card"><img class="photo" src="lake.jpg" alt="Lacul Ursu, Sovata" loading="lazy"><h3>Bear Lake (Lacul Ursu)</h3><p>Take a scenic walk around one of Sovata's best-known natural attractions.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Lacul+Ursu+Sovata">Map</a></div><div class="card"><img class="photo" src="train.jpg" alt="Mocănița Sovata" loading="lazy"><h3>Mocănița Sovata</h3><p>Enjoy a heritage train excursion. Check the current schedule before visiting.</p><a class="btn light" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Mocanita+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="drumul-sarii.jpg" alt="Salt Trail (Drumul Sării)" loading="lazy"><h3>Salt Trail (Drumul Sării)</h3><p>A nature trail through woodland, salt formations and lakes. The Salt educational trail is approximately 970 metres long.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Drumul+Sarii+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="lacuri-rosu-verde.jpg" alt="Red and Green Lakes" loading="lazy"><h3>Red and Green Lakes</h3><p>Two salt lakes to admire from designated paths near the Salt Mountain.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Rosu+Lacul+Verde+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="muntele-sare.jpg" alt="Salt Mountain" loading="lazy"><h3>Salt Mountain</h3><p>Discover natural salt formations near Bear Lake. Please stay on marked paths.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Muntele+de+Sare+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="belvedere.jpg" alt="Belvedere Tower" loading="lazy"><h3>Belvedere Tower</h3><p>A viewpoint overlooking Sovata and the surrounding hills. The walk includes an uphill section.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Turnul+Belvedere+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="tivoli.jpg" alt="Lake Tivoli" loading="lazy"><h3>Lake Tivoli</h3><p>A peaceful place for a nature walk. Available activities may vary by season.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Tivoli+Sovata">Map</a></div><div class="card attraction-card"><img class="attraction-photo" src="alunis.jpg" alt="Lake Aluniș" loading="lazy"><h3>Lake Aluniș</h3><p>A salt lake close to Bear Lake, ideal to explore on foot.</p><a class="btn light" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Lacul+Alunis+Sovata">Map</a></div></div>`], ['Contact us during your stay', `<p>Need anything during your stay? Contact us by phone or WhatsApp.</p><a class="btn" href="https://wa.me/40749250933">Message on WhatsApp</a><a class="btn light" href="tel:+40749250933">Call: 0749 250 933</a><a class="btn light" href="mailto:saltandsoul.sovata@gmail.com">Email</a><p class="muted">With salt and soul, Gabriella and Boróka</p>`]], footer: 'Wishing you a relaxing stay.'}, hu: {hero: 'Üdvözlünk a Salt & Soul villában!', intro: 'Minden hasznos információ egy helyen a nyugodt szovátai pihenéshez.', nav: ['Érkezés', 'Parkolás', 'Felszereltség', 'Reggeli · Ciuperca Mică', 'SPA', 'Programok', 'Kapcsolat'], sections: [['Érkezés és távozás', `<div class="grid"><div class="card"><div class="muted">BEJELENTKEZÉS</div><div class="big">14:00–24:00</div><p>Önálló bejelentkezés. Állandó recepció nincs.</p></div><div class="card"><div         function setSlide(carousel, index) {const images = carousel.querySelectorAll('.slides img'); const n = images.length; index = (index + n) % n; carousel.dataset.index = index; carousel.querySelector('.slides').style.transform = `translateX(-${index * 100}%)`; carousel.querySelectorAll('.slide-dot').forEach((dot, i) => {dot.classList.toggle('active', i === index); dot.setAttribute('aria-pressed', String(i === index));});} function moveSlide(button, direction) {const carousel = button.closest('[data-carousel]'); setSlide(carousel, Number(carousel.dataset.index || 0) + direction)} function frameCarousels() {document.querySelectorAll('[data-carousel]').forEach(carousel => {if (carousel.parentElement.classList.contains('media-frame')) return; const frame = document.createElement('div'); frame.className = 'media-frame'; carousel.parentNode.insertBefore(frame, carousel); frame.appendChild(carousel)})} function initCarousels() {document.querySelectorAll('[data-carousel]').forEach(carousel => {const n = carousel.querySelectorAll('.slides img').length; const dots = carousel.querySelector('.slide-dots'); dots.innerHTML = ''; for (let i = 0; i < n; i++) {const dot = document.createElement('button'); dot.type = 'button'; dot.className = 'slide-dot'; dot.setAttribute('aria-label', `Photo ${i + 1} of ${n}`); dot.addEventListener('click', () => setSlide(carousel, i)); dots.appendChild(dot)} setSlide(carousel, 0); let startX = null; carousel.addEventListener('touchstart', e => {startX = e.touches[0].clientX}, {passive: true}); carousel.addEventListener('touchend', e => {if (startX !== null) {const delta = e.changedTouches[0].clientX - startX; if (Math.abs(delta) > 45) setSlide(carousel, Number(carousel.dataset.index || 0) + (delta < 0 ? 1 : -1)); startX = null} }, {passive: true})})} function setLang(lang) {const d = data[lang]; document.documentElement.lang = lang; document.getElementById('hero').textContent = d.hero; document.getElementById('intro').textContent = d.intro; document.getElementById('footertext').textContent = d.footer; document.getElementById('nav').innerHTML = d.nav.map((x, i) => `<a href="#s${i}">${x}</a>`).join(''); document.getElementById('content').innerHTML = d.sections.map((s, i) => `<section id="s${i}"><h2>${s[0]}</h2>${s[1]}</section>`).join(''); frameCarousels(); initCarousels(); applySimpleExtras(lang); for (const l of ['ro', 'en', 'hu']) document.getElementById(l).classList.toggle('active', l === lang); try {localStorage.setItem('ss-lang', lang)} catch (e) { } } function copyWifi() {if (navigator.clipboard) navigator.clipboard.writeText('salt2025'); else prompt('WiFi', 'salt2025')} let initial = 'ro'; try {initial = localStorage.getItem('ss-lang') || 'ro'} catch (e) { } setLang(data[initial] ? initial : 'ro');</script>
